name: ubuntu

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y xsltproc

      - name: Use Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: XSD documentation generation
        run: make

      # Optional: keeps the downloadable zip on every run
      - uses: actions/upload-artifact@v5
        with:
          name: published-ubuntu
          path: docs

      # Artifact consumed by the Pages deploy job
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy-gh-pages:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
